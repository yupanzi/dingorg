# 默认值；部署时用 -f 覆盖（从 values.example.yaml 起步）。chart 不自建 Secret。

# 资源名前缀，留空即 chart 名
nameOverride: ''

image:
  # 默认即发版推的镜像（ci.yml 的 IMAGE）。⚠️ IMAGE 由仓库路径派生，仓库改名 / 转移后这里要手改。
  # 所有 Pod 共用，靠 command 区分入口
  repository: ghcr.io/yupanzi/dingorg
  # 留空即 Chart.yaml 的 appVersion（release 时两者一起 bump）。别填 latest：IfNotPresent 下
  # 节点上有旧的 latest 就不再拉，各节点跑的版本会不一样
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []

# 凭证的默认来源：每个组件只注入自己 secretKeys 里列的键，env 里没给的取这个 Secret 的同名键。
# 列到的键都在 env 里给了就可以留空
secretName: dingorg-app

# ⚠️ 改了 Secret 必须 bump 这个值（任意字符串），否则常驻进程还拿着旧值
secretVersion: ''

# 从这里到 resources 五类 Pod 共用；server / migration / cronjobs.<name> 里写了同名项（非空）就
# 整个替换，只有 env 按键合并。
# env 的值写字符串即 value，写对象即 EnvVar 去掉 name 原样透传（valueFrom 等），留空不渲染。
# ⚠️ 凭证写成字符串会留在 release 历史里（helm get values 可读），优先用 valueFrom：
#   DATABASE_URL:
#     valueFrom: { secretKeyRef: { name: pg-app, key: uri } }
env:
  # 对外 origin（不带路径，issuer 是它加 /oidc），留空即从 ingress.host 派生。
  # 是否信任 x-forwarded-* 由它的协议决定（https = 信任）：
  # ⚠️ 前提是代理覆盖（而非透传）x-forwarded-*，且不可绕过代理直连
  PUBLIC_ORIGIN: ''

  # fatal / error / warn / info / debug / trace / silent，留空即 info
  LOG_LEVEL: ''
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }

server:
  # 无状态（会话与组织数据都在 PG），可水平扩；组织同步靠 PG 里的租约，多副本同一时刻只有一个在拉钉钉
  replicas: 2
  secretKeys: [DATABASE_URL, DINGTALK_APP_KEY, DINGTALK_APP_SECRET, AUTH_JSON]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

service:
  type: ClusterIP
  annotations: {}

# 部署 hook 用的是 cronjobs.orgsync 这一份。
# schedule 按 kube-controller-manager 的时区（通常 UTC）。backoffLimit 必须显式给。
cronjobs:
  oidcpurge:
    # ⚠️ 清理 OIDC 过期工件，删了它 oidc_payloads 会无限涨
    schedule: '43 2 * * *'
    secretKeys: [DATABASE_URL]
    backoffLimit: 2
  orgsync:
    # ⚠️ 自有应用组织数据的每日同步，删了它离职的人一直能登录。与部署 hook 撞上时由租约排队。
    # UTC 04:00 = 北京时间 12:00
    schedule: '0 4 * * *'
    # 直接调同步（不经 HTTP），所以要库与钉钉凭证，不要任何 API key
    secretKeys: [DATABASE_URL, DINGTALK_APP_KEY, DINGTALK_APP_SECRET]
    # 失败由进程内重试（间隔长于同步冷却），Job 层不再重试；驱逐等中断不计入
    backoffLimit: 0

# 每次 install / upgrade 后跑一次 orgsync（post-install/post-upgrade hook）：首次部署不用手动
# 触发，升级后组织数据立即按新代码重建（hook 用的就是新镜像，不依赖常驻 Pod 滚完）。
# 它失败会让这次 release 标成失败。
syncOnDeploy: true

ingress:
  enabled: true
  # 留空不渲染 ingressClassName，用集群默认的 IngressClass
  className: nginx
  host: ''
  annotations: {}
  tls: true
  # 留空即 <name>-tls
  tlsSecretName: ''

migration:
  enabled: true
  secretKeys: [DATABASE_URL]
