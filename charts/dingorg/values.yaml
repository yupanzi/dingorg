# 默认值；部署时用 -f 覆盖（从 values.example.yaml 起步）。
# 敏感值不进 values（会留在 release 历史里），放在预先建好的 Secret 里。

image:
  # 如 ghcr.io/your-org/dingorg。所有 Pod 共用，靠 command 区分入口
  repository: ''
  # 留空即 Chart.yaml 的 appVersion（release 时两者一起 bump）。别填 latest：IfNotPresent 下
  # 节点上有旧的 latest 就不再拉，各节点跑的版本会不一样
  tag: ''
  pullPolicy: IfNotPresent

# 存放 DATABASE_URL / 钉钉凭证 / AUTH_JSON 的 Secret 名
secretName: dingorg-app

# ⚠️ 改了 Secret 必须 bump 这个值（任意字符串），否则常驻进程还拿着旧值
secretVersion: ''

# 留空的键不渲染，用进程侧默认值或派生值
env:
  # 对外 origin（不带路径，issuer 是它加 /oidc），留空即从 ingress.host 派生。
  # 是否信任 x-forwarded-* 由它的协议决定（https = 信任）：
  # ⚠️ 前提是代理覆盖（而非透传）x-forwarded-*，且不可绕过代理直连
  PUBLIC_ORIGIN: ''

  # fatal / error / warn / info / debug / trace / silent，留空即 info。所有 Pod 共用
  LOG_LEVEL: ''

server:
  # 无状态（会话与组织数据都在 PG），可水平扩；组织同步靠 PG 里的租约，多副本同一时刻只有一个在拉钉钉
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# 每个 cron 只注入 secretKeys 里列出的键，别改回 envFrom 整个 Secret。
# schedule 按 kube-controller-manager 的时区（通常 UTC）。backoffLimit 必须显式给。
cronjobs:
  oidcpurge:
    # ⚠️ 清理 OIDC 过期工件，删了它 oidc_payloads 会无限涨
    schedule: '43 2 * * *'
    secretKeys: [DATABASE_URL]
    backoffLimit: 2
  orgsync:
    # ⚠️ 自有应用组织数据的每日同步，删了它离职的人一直能登录。与部署 hook 撞上时由租约排队。
    # UTC 04:00 = 北京时间 12:00
    schedule: '0 4 * * *'
    # 直接调同步（不经 HTTP），所以要库与钉钉凭证，不要任何 API key
    secretKeys: [DATABASE_URL, DINGTALK_APP_KEY, DINGTALK_APP_SECRET]
    # 失败由进程内重试（间隔长于同步冷却），Job 层不再重试；驱逐等中断不计入
    backoffLimit: 0

# 每次 install / upgrade 后跑一次 orgsync（post-install/post-upgrade hook）：首次部署不用手动
# 触发，升级后组织数据立即按新代码重建（hook 用的就是新镜像，不依赖常驻 Pod 滚完）。
# 它失败会让这次 release 标成失败。
syncOnDeploy: true

ingress:
  enabled: true
  className: nginx
  host: ''
  tls: true

migration:
  enabled: true
