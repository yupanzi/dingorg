{{- /* PUBLIC_ORIGIN 从 ingress.host 派生：再填一遍只会制造配错机会 */}}
{{- $server := deepCopy .Values.server }}
{{- $env := $server.env | default dict }}
{{- if and .Values.ingress.host (not (or $env.PUBLIC_ORIGIN .Values.env.PUBLIC_ORIGIN)) }}
{{- $_ := set $env "PUBLIC_ORIGIN" (printf "%s://%s" (ternary "https" "http" .Values.ingress.tls) .Values.ingress.host) }}
{{- end }}
{{- $_ := set $server "env" $env }}
{{- $c := dict "root" . "cfg" $server "component" "server" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dingorg.name" . }}-server
  labels:
    {{- include "dingorg.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "dingorg.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      {{- include "dingorg.podMetadata" $c | nindent 6 }}
    spec:
      {{- with include "dingorg.podSpec" $c }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: server
          {{- include "dingorg.containerBase" $c | nindent 10 }}
          command: ['node', 'dist/server.js']
          ports:
            # 与 src/env.ts 的 LISTEN_PORT 一致；探针与 Service 按名字引用它
            - name: http
              containerPort: 3080
          env:
            {{- include "dingorg.env" $c | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dingorg.name" . }}
  labels:
    {{- include "dingorg.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    {{- include "dingorg.selectorLabels" $c | nindent 4 }}
{{- if and .Values.ingress.enabled .Values.ingress.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dingorg.name" . }}
  labels:
    {{- include "dingorg.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" (include "dingorg.name" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dingorg.name" . }}
                port:
                  number: 80
{{- end }}
