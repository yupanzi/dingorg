apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dingorg.name" . }}-server
  labels:
    {{- include "dingorg.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dingorg.name" . }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dingorg.name" . }}
        app.kubernetes.io/component: server
      {{- with include "dingorg.podAnnotations" . }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['node', 'dist/server.js']
          ports:
            - containerPort: {{ .Values.server.port }}
          env:
            {{- include "dingorg.env" . | nindent 12 }}
          envFrom:
            {{- include "dingorg.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.server.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.server.port }} }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dingorg.name" . }}
  labels:
    {{- include "dingorg.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.server.port }}
      name: http
  selector:
    app.kubernetes.io/name: {{ include "dingorg.name" . }}
    app.kubernetes.io/component: server
{{- if and .Values.ingress.enabled .Values.ingress.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dingorg.name" . }}
  labels:
    {{- include "dingorg.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ include "dingorg.name" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dingorg.name" . }}
                port:
                  number: 80
{{- end }}
