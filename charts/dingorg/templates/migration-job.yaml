{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dingorg.name" . }}-migrate
  labels:
    {{- include "dingorg.labels" . | nindent 4 }}
  annotations:
    # 失败时 Helm 中止整次升级，不会出现「迁移失败但应用已滚上去」
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    {{- include "dingorg.taskPodTemplate" (dict "root" . "cfg" .Values.migration "component" "migrate" "name" "migrate" "entry" "dist/bin/migrate.js") | nindent 4 }}
{{- end }}
