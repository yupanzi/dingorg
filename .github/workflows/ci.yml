# check：lint + 类型 + 测试（含需要真实 Postgres 的集成测试）。
# build：PR 上只构建，push 到默认分支才推 GHCR。deploy 不进 CI（不放集群凭证）。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# 默认分支不取消，避免半路中断镜像推送
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dingorg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/dingorg
    steps:
      - uses: actions/checkout@v4
      # 必须先于 setup-node（cache: pnpm 要找到可执行文件）；版本读 packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm typecheck

      # 同时断言 DATABASE_URL 有效：这一步过了，集成测试就不会静默跳过
      - run: pnpm db:migrate

      - run: pnpm test

      - run: helm lint charts/dingorg -f charts/dingorg/values.example.yaml

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 解析镜像坐标
        id: img
        run: |
          # GHCR 只接受小写路径
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ steps.img.outputs.repo }}:${{ steps.img.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
